name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + dev + CPU torch + hydra)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,repro]"

      - name: Lint (no dead code / undefined names)
        run: |
          pip install pyflakes
          python -m pyflakes src/phytonet scripts

      - name: Run tests
        run: pytest -q
